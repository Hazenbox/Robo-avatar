<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <script>try{var t=localStorage.getItem("zoro-avatar:theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t;else document.documentElement.dataset.theme="dark"}catch(e){document.documentElement.dataset.theme="dark"}</script>
    <title>Zoro: a face for your AI</title>
    <meta name="description" content="Little animated robots that show what your AI is doing: listening, thinking, loading, generating. Open source, tiny, and drawn live in code." />
    <meta name="theme-color" content="#0e0e12" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Zoro: a face for your AI" />
    <meta property="og:description" content="Little animated robots that show what your AI is doing. Open source, tiny, and drawn live in code." />
    <meta property="og:url" content="https://zoro-avatar.vercel.app" />
    <meta property="og:image" content="https://zoro-avatar.vercel.app/social-card.png" />
    <meta property="og:image:width" content="1280" />
